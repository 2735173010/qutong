<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠头幼儿园通知公告栏</title>
<style>
  :root{
    --yellow:#FFD66B;
    --yellow-light:#FFE9A8;
    --mint:#A8E6CF;
    --mint-light:#C8F0DE;
    --pink:#FFD1DC;
    --pink-light:#FFE3EC;
    --cream:#FFF9F0;
    --text:#5A4A42;
    --text-soft:#8A7A70;
    --shadow:0 10px 30px rgba(255,150,90,.22);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:17px;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC",sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,#FFF6E0 0%,#FFF0F5 55%,#EAFBF3 100%);
    background-attachment:fixed;
    min-height:100vh;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 60px;}

  /* ===== 页头 ===== */
  header{
    text-align:center;
    padding:42px 16px 26px;
    position:relative;
  }
  .deco{font-size:1.9rem;letter-spacing:.4rem;opacity:.9;user-select:none;}
  h1{
    font-size:3rem;
    line-height:1.2;
    margin:16px 0 12px;
    color:#E8743B;
    text-shadow:2px 2px 0 #fff, 5px 5px 0 rgba(255,196,140,.7);
    font-weight:800;
    letter-spacing:1px;
  }
  .subtitle{
    display:inline-block;
    background:rgba(255,255,255,.7);
    border:2px dashed var(--mint);
    color:var(--text-soft);
    padding:6px 18px;
    border-radius:999px;
    font-size:1rem;
  }

  /* ===== 顶部操作条 ===== */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
    margin:8px 0 26px;
  }
  .btn{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:700;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:13px 26px;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--yellow),#FFC24B);color:#6B4A1E;}
  .btn-mint{background:linear-gradient(135deg,var(--mint),#7FD9B8);color:#1E5B47;}
  .btn-pink{background:linear-gradient(135deg,var(--pink),#FFA9C0);color:#7A2E47;}
  .btn-ghost{background:rgba(255,255,255,.75);color:var(--text-soft);box-shadow:none;border:2px solid #F0D9C8;}

  /* ===== 列表 ===== */
  .list{display:flex;flex-direction:column;gap:20px;}
  .empty{
    text-align:center;color:var(--text-soft);
    background:rgba(255,255,255,.6);
    border:2px dashed var(--pink);
    border-radius:var(--radius);
    padding:40px 20px;font-size:1.1rem;
  }
  .card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 24px;
    border-left:10px solid var(--yellow);
    position:relative;
    animation:pop .35s ease both;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 40px rgba(255,140,80,.30);
  }
  .card.c2{border-left-color:var(--mint);}
  .card.c3{border-left-color:var(--pink);}
  @keyframes pop{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .card-title{font-size:1.35rem;font-weight:800;color:#4A3A32;line-height:1.4;}
  .date-badge{
    flex:0 0 auto;
    background:var(--mint-light);
    color:#1E5B47;
    font-size:.9rem;font-weight:700;
    padding:5px 14px;border-radius:999px;white-space:nowrap;
  }
  .card-body{margin-top:12px;color:#6A5A50;font-size:1.05rem;white-space:pre-wrap;}
  .card-body.clamp{
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-foot{margin-top:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .link-btn{
    background:none;border:none;cursor:pointer;font-family:inherit;
    color:#E8896B;font-weight:700;font-size:1rem;padding:2px 0;
  }
  .link-btn:hover{text-decoration:underline;}
  .mini-btn{
    font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
    border:2px solid #F0D9C8;background:rgba(255,255,255,.85);color:var(--text-soft);
    border-radius:999px;padding:5px 13px;transition:all .12s;
  }
  .mini-btn:hover{border-color:var(--mint);color:#1E5B47;}
  .del-btn{
    margin-left:auto;background:none;border:none;cursor:pointer;
    color:var(--text-soft);font-size:.95rem;font-weight:600;
  }
  .del-btn:hover{color:#D9534F;}

  /* 类型筛选条 */
  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 24px;}
  .filter-btn{
    font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;
    border:2px solid #F0D9C8;background:rgba(255,255,255,.75);color:var(--text-soft);
    border-radius:999px;padding:7px 16px;transition:all .12s;
  }
  .filter-btn:hover{border-color:var(--mint);}
  .filter-btn.active{background:linear-gradient(135deg,var(--yellow),#FFC24B);color:#6B4A1E;border-color:transparent;}

  /* 重要通知 */
  .card.important{border-left-color:#FF7A7A;background:#FFF6F6;}
  .card.important .card-title{color:#C0392B;}
  .imp-badge{
    display:inline-block;background:#FF6B6B;color:#fff;font-size:.8rem;font-weight:700;
    padding:2px 10px;border-radius:999px;margin-right:8px;vertical-align:middle;
  }
  .type-tag{
    display:inline-block;background:var(--mint-light);color:#1E5B47;font-size:.8rem;font-weight:700;
    padding:3px 11px;border-radius:999px;margin-top:2px;
  }
  .check-line{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.02rem;cursor:pointer;}
  .check-line input{width:20px;height:20px;accent-color:#FF6B6B;cursor:pointer;flex:0 0 auto;}

  /* ===== 弹窗 ===== */
  .mask{
    position:fixed;inset:0;background:rgba(90,74,66,.45);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .mask.show{display:flex;}
  .modal{
    background:#fff;border-radius:24px;width:100%;max-width:520px;
    padding:26px 24px 24px;box-shadow:0 20px 50px rgba(0,0,0,.2);
    max-height:90vh;overflow:auto;
  }
  .modal h2{font-size:1.5rem;color:#E8896B;margin-bottom:18px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:700;margin-bottom:7px;font-size:1.05rem;}
  .field input,.field textarea{
    width:100%;font-family:inherit;font-size:1.05rem;color:var(--text);
    border:2px solid #F0E0D2;border-radius:14px;padding:12px 14px;background:var(--cream);
    outline:none;transition:border-color .15s;
  }
  .field input:focus,.field textarea:focus{border-color:var(--mint);}
  .field textarea{resize:vertical;min-height:110px;line-height:1.6;}

  /* 智能生成区 */
  .gen-box{
    background:linear-gradient(135deg,#FFF7FB,#F1FBF6);
    border:2px solid var(--pink-light);
    border-radius:16px;padding:14px 16px;margin-bottom:4px;
  }
  .gen-label{font-weight:800;color:#E8896B;margin-bottom:10px;font-size:1.02rem;}
  .gen-row{display:flex;gap:10px;margin-bottom:10px;}
  .gen-select{
    flex:1;font-family:inherit;font-size:1.02rem;color:var(--text);
    border:2px solid #F0E0D2;border-radius:14px;padding:12px 14px;background:var(--cream);outline:none;
  }
  .gen-select:focus{border-color:var(--pink);}
  .gen-brief{
    width:100%;font-family:inherit;font-size:1.02rem;color:var(--text);
    border:2px dashed var(--pink);border-radius:14px;padding:12px 14px;background:#FFFDFE;
    outline:none;resize:vertical;min-height:64px;line-height:1.6;
  }
  .gen-brief:focus{border-color:var(--mint);}
  .modal-actions{display:flex;gap:12px;margin-top:8px;}
  .modal-actions .btn{flex:1;}

  /* 分享卡片弹窗 */
  .share-modal{max-width:460px;}
  .share-card{
    background:linear-gradient(160deg,#FFFDF8,#FFF3F7);
    border:3px solid var(--yellow);
    border-radius:20px;padding:24px 22px;text-align:center;
    box-shadow:var(--shadow);margin-bottom:16px;
  }
  .sc-head{
    display:block;
    background:linear-gradient(135deg,#FF8A3D,#FF6B9D);
    color:#fff;font-weight:800;font-size:1.15rem;
    padding:12px 18px;border-radius:14px;margin-bottom:16px;text-align:center;
  }
  .sc-imp{
    display:inline-block;background:#FF3B3B;color:#fff;font-weight:800;font-size:.95rem;
    padding:5px 16px;border-radius:999px;margin-bottom:12px;
  }
  .sc-title{color:#3A2A22;font-weight:800;font-size:1.7rem;line-height:1.4;margin-bottom:12px;}
  .sc-date{
    display:inline-block;background:#FF8A3D;color:#fff;font-weight:700;
    font-size:.95rem;padding:5px 16px;border-radius:999px;margin-bottom:14px;
  }
  .sc-body{color:#4A3A32;font-size:1.05rem;line-height:1.85;text-align:left;white-space:pre-wrap;}
  .sc-foot{margin-top:16px;color:var(--text-soft);font-size:.95rem;}
  .sc-cta{
    display:inline-block;background:#FF3B3B;color:#fff;font-weight:800;font-size:.98rem;
    padding:9px 20px;border-radius:999px;margin-top:14px;
  }
  .share-img{
    display:block;width:100%;border-radius:16px;margin-top:16px;
    box-shadow:var(--shadow);background:#fff;
  }
  .share-hint{
    margin-top:12px;font-size:.92rem;color:var(--text-soft);line-height:1.7;
    background:rgba(255,255,255,.7);border-radius:12px;padding:10px 14px;
  }

  /* ===== 页脚 ===== */
  footer{
    text-align:center;margin-top:34px;color:var(--text-soft);font-size:.92rem;
    display:flex;flex-direction:column;gap:14px;align-items:center;
  }
  .footer-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .hint{
    background:rgba(255,255,255,.6);border-radius:14px;padding:10px 16px;
    max-width:560px;line-height:1.6;
  }

  /* ===== 手机端 ===== */
  @media (max-width:600px){
    html{font-size:18px;}
    h1{font-size:2.2rem;}
    .deco{font-size:1.5rem;}
    .wrap{padding:0 12px 50px;}
    header{padding:30px 10px 18px;}
    .card{padding:18px 16px;border-left-width:8px;}
    .card-title{font-size:1.25rem;}
    .btn{font-size:1.05rem;padding:14px 22px;width:100%;}
    .toolbar{flex-direction:column;}
    .toolbar .btn{width:100%;}
    .modal-actions{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="deco">🌟 🍎 ☁️ 🌈 🧸</div>
    <h1 id="siteTitle">🌞 渠头幼儿园通知公告栏 🌸</h1>
    <div class="subtitle">家园共育 · 第一时间获取园所动态</div>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">＋ 发布通知</button>
    <button class="btn btn-ghost" onclick="editSiteName()">✎ 园所名称</button>
    <button class="btn btn-mint" onclick="exportBackup()">⬇ 导出备份</button>
    <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆ 导入备份</button>
    <button class="btn btn-ghost" onclick="resetSamples()">↺ 恢复示例</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
  </div>

  <div class="filters" id="filters"></div>

  <div class="list" id="list"></div>

  <footer>
    <div class="hint">
      💡 提示：点「＋ 发布通知」后，用「🤖 智能生成」选类型+说一句，即可自动生成规范公告。<br>
      通知保存在当前浏览器，换设备前请先「导出备份」；点卡片下方「展开查看全文」看完整内容。
    </div>
    <div class="footer-tools">
      <span id="siteFooter">渠头幼儿园 · 温馨相伴 🌱</span>
    </div>
  </footer>

</div>

<!-- 发布通知弹窗 -->
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2>📝 发布新通知</h2>
    <div class="field">
      <label for="f-title">通知标题</label>
      <input id="f-title" type="text" placeholder="例如：本周亲子活动通知" maxlength="50">
    </div>
    <div class="field">
      <label for="f-date">发布日期</label>
      <input id="f-date" type="date">
    </div>

    <div class="field">
      <div class="gen-box">
        <div class="gen-label">🤖 智能生成（选填：选类型 + 说一句，自动生成规范公告）</div>
        <div class="gen-row">
          <select id="f-type" class="gen-select">
            <option value="holiday">放假安排</option>
            <option value="activity">活动报名</option>
            <option value="safety">安全提示</option>
            <option value="recipe">幼儿食谱</option>
            <option value="fee">收费通知</option>
            <option value="meeting">家长会</option>
            <option value="tips">温馨提示</option>
            <option value="other">其他</option>
          </select>
          <button type="button" class="btn btn-pink" onclick="generateContent()">✨ 生成</button>
        </div>
        <textarea id="f-brief" class="gen-brief" placeholder="例如：国庆节10月1日到7日放假，8日开学，提醒家长注意孩子安全"></textarea>
      </div>
    </div>

    <div class="field">
      <label class="check-line"><input type="checkbox" id="f-important"> ⭐ 标为重要通知（置顶 + 红色提醒）</label>
    </div>

    <div class="field">
      <label for="f-content">通知内容（可手动修改）</label>
      <textarea id="f-content" placeholder="点上方「✨ 生成」自动填充，或在此直接手写；家长可在卡片里展开查看全文～"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveNotice()">保存发布</button>
    </div>
  </div>
</div>

<!-- 分享卡片弹窗 -->
<div class="mask" id="shareMask" onclick="if(event.target===this)closeShare()">
  <div class="modal share-modal">
    <div class="share-card" id="shareCard"></div>
    <img id="shareImg" class="share-img" alt="通知卡片图片" style="display:none">
    <div id="shareHint" class="share-hint" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeShare()">关闭</button>
      <button class="btn btn-mint" onclick="copyShare()">📋 复制文字</button>
      <button class="btn btn-primary" onclick="saveCardImage()">🖼 保存图片</button>
    </div>
  </div>
</div>

<script>
  const KEY = "qutou_kindergarten_notices";
  const SITE_KEY = "qutou_site_name";
  let siteName = localStorage.getItem(SITE_KEY) || "渠头幼儿园";

  const SAMPLES = [
    {
      id: 2003,
      title: "关于秋季亲子运动会的通知",
      date: "2026-10-15",
      type: "activity",
      important: false,
      content: "各位家长：\n我园将于 11 月 5 日上午举办秋季亲子运动会，请家长提前安排好时间，准时参加。\n具体活动项目、场地与注意事项将另行通知，敬请留意班级群消息。\n期待您和孩子的欢乐时光！🏃"
    },
    {
      id: 2002,
      title: "天气转凉温馨提示",
      date: "2026-10-12",
      type: "tips",
      important: false,
      content: "各位家长：\n近日气温下降，昼夜温差较大，请家长为幼儿准备外套，注意保暖，及时增减衣物。\n同时请提醒孩子多喝温水、勤洗手，预防秋季感冒。\n让我们共同守护孩子的健康～🌿"
    },
    {
      id: 2001,
      title: "十一国庆节放假安排",
      date: "2026-09-28",
      type: "holiday",
      important: false,
      content: "各位家长：\n根据上级安排，国庆节放假时间为 10 月 1 日至 10 月 7 日，共 7 天。\n10 月 8 日正常入园，请家长提前做好安排。\n假期请关注孩子的安全与健康，祝大家节日快乐！🌺"
    }
  ];

  function load(){
    const raw = localStorage.getItem(KEY);
    if(!raw){
      localStorage.setItem(KEY, JSON.stringify(SAMPLES));
      return SAMPLES.slice();
    }
    try { return JSON.parse(raw); } catch(e){ return SAMPLES.slice(); }
  }
  function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }

  let notices = load();

  const TYPE_LABEL = {
    holiday:"放假", activity:"活动", safety:"安全", recipe:"食谱",
    fee:"收费", meeting:"家长会", tips:"温馨提示", other:"其他"
  };
  let currentFilter = "all";

  function buildFilters(){
    const el = document.getElementById("filters");
    const items = [["all","全部"],["holiday","放假"],["activity","活动"],["safety","安全"],
      ["recipe","食谱"],["fee","收费"],["meeting","家长会"],["tips","温馨提示"],["other","其他"]];
    el.innerHTML = items.map(([k,v])=>
      `<button class="filter-btn${currentFilter===k?" active":""}" onclick="setFilter('${k}')">${v}</button>`
    ).join("");
  }
  function setFilter(k){ currentFilter = k; buildFilters(); render(); }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }
  // 日期统一显示为中文格式：2026-10-15 → 2026年10月15日
  function fmtDate(iso){
    if(!iso) return "";
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(iso);
    if(!m) return iso;
    return m[1] + "年" + parseInt(m[2],10) + "月" + parseInt(m[3],10) + "日";
  }
  // 画布中移除 emoji（避免显示为方框），仅用于图片绘制
  // 画布中移除 emoji（避免显示为方框），仅用于图片绘制
  function stripEmoji(s){
    return (s||"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, "");
  }

  function applySiteName(){
    document.title = siteName + "通知公告栏";
    const t = document.getElementById("siteTitle");
    if(t) t.textContent = "🌞 " + siteName + "通知公告栏 🌸";
    const f = document.getElementById("siteFooter");
    if(f) f.textContent = siteName + " · 温馨相伴 🌱";
  }
  function editSiteName(){
    const v = prompt("请输入幼儿园名称：", siteName);
    if(v === null) return;
    const name = v.trim();
    if(!name){ alert("名称不能为空哦～"); return; }
    siteName = name;
    localStorage.setItem(SITE_KEY, siteName);
    applySiteName();
  }

  function render(){
    const list = document.getElementById("list");
    let view = notices.filter(n => currentFilter === "all" || (n.type || "other") === currentFilter);
    // 重要通知置顶
    view = view.slice().sort((a,b)=> (b.important?1:0) - (a.important?1:0));
    if(!view.length){
      const msg = currentFilter === "all" ? "暂无通知，点击「＋ 发布通知」添加第一条吧～" : "该分类下暂无通知～";
      list.innerHTML = '<div class="empty">📭 ' + msg + '</div>';
      return;
    }
    list.innerHTML = view.map((n,i)=>{
      const cls = "c" + ((i%3)+1);
      const imp = n.important ? " important" : "";
      const impBadge = n.important ? '<span class="imp-badge">重要</span>' : "";
      const typeTag = (n.type && n.type !== "other") ? `<div><span class="type-tag">${TYPE_LABEL[n.type]||""}</span></div>` : "";
      const content = escapeHtml(n.content).replace(/\n/g,"<br>");
      return `
      <div class="card ${cls}${imp}">
        <div class="card-head">
          <div class="card-title">${impBadge}${escapeHtml(n.title)}</div>
          <span class="date-badge">${escapeHtml(fmtDate(n.date))}</span>
        </div>
        ${typeTag}
        <div class="card-body clamp" id="body-${n.id}">${content}</div>
        <div class="card-foot">
          <button class="link-btn" onclick="toggleBody(${n.id})" id="toggle-${n.id}">展开查看全文 ▾</button>
          <button class="mini-btn" onclick="copyNotice(${n.id})">📋 复制</button>
          <button class="mini-btn" onclick="openShare(${n.id})">🎴 卡片</button>
          <button class="del-btn" onclick="delNotice(${n.id})">🗑 删除</button>
        </div>
      </div>`;
    }).join("");
  }

  function toggleBody(id){
    const el = document.getElementById("body-"+id);
    const btn = document.getElementById("toggle-"+id);
    if(el.classList.contains("clamp")){
      el.classList.remove("clamp");
      btn.textContent = "收起 ▴";
    }else{
      el.classList.add("clamp");
      btn.textContent = "展开查看全文 ▾";
    }
  }

  function openModal(){
    document.getElementById("f-title").value = "";
    document.getElementById("f-content").value = "";
    document.getElementById("f-brief").value = "";
    document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
    document.getElementById("f-type").value = "holiday";
    document.getElementById("f-important").checked = false;
    document.getElementById("mask").classList.add("show");
  }
  function closeModal(){ document.getElementById("mask").classList.remove("show"); }

  function saveNotice(){
    const title = document.getElementById("f-title").value.trim();
    const date = document.getElementById("f-date").value;
    const content = document.getElementById("f-content").value.trim();
    const type = document.getElementById("f-type").value;
    const important = document.getElementById("f-important").checked;
    if(!title){ alert("请填写通知标题～"); return; }
    if(!date){ alert("请选择发布日期～"); return; }
    if(!content){ alert("请填写通知内容～"); return; }
    notices.unshift({ id: Date.now(), title, date, content, type, important });
    save(notices);
    render();
    closeModal();
  }

  // ===== 智能生成规范公告 =====
  const TYPE_TITLE = {
    holiday:"放假安排通知", activity:"活动报名通知", safety:"安全温馨提示",
    recipe:"幼儿营养食谱", fee:"收费通知", meeting:"家长会通知", tips:"温馨提示", other:"通知"
  };
  const TYPE_BODY = {
    holiday: b => `各位家长：

${b}

温馨提示：
1. 请您关注孩子的人身安全，远离水域、交通等危险区域；
2. 保持规律的作息，合理安排游戏与休息时间；
3. 注意饮食卫生与冷暖变化，预防季节性疾病。

祝大家假期愉快，平安健康！🌺`,
    activity: b => `亲爱的家长：

${b}

报名与参与：
1. 请有意向参加的家长，到班级老师处登记报名；
2. 活动的具体时间、地点与流程，以班级群后续通知为准；
3. 建议家长提前安排好时间，与孩子共同享受欢乐时光。

期待您的参与！🏃`,
    safety: b => `各位家长：

${b}

安全小贴士：
1. 加强日常看护，不让孩子单独外出或独处；
2. 教育孩子不跟陌生人走，牢记家长电话与家庭住址；
3. 出行遵守交通规则，过马路走斑马线、不闯红灯。

安全无小事，感谢您的配合与守护。🛡`,
    recipe: b => `亲爱的家长：

本周幼儿营养食谱新鲜出炉，一起来看看吧～

${b}

如有过敏食材或特殊饮食需求，请提前告知班级老师，我们会悉心安排。🍱`,
    fee: b => `各位家长：

${b}

缴费说明：
1. 缴费的方式、金额与截止时间，请关注班级群或园所通知；
2. 如对费用有疑问，可联系班级老师或园所财务咨询；
3. 请在规定时间内完成缴费，以便园所统一安排。

感谢您的理解与支持！💳`,
    meeting: b => `亲爱的家长：

${b}

参会提示：
1. 请提前安排好时间，准时参加；
2. 如有特殊情况无法到场，请提前与老师沟通；
3. 会议期间请将手机调至静音，共同营造良好氛围。

让我们家园携手，陪伴孩子更好地成长。🤝`,
    tips: b => `各位家长：

${b}

如您有任何疑问，欢迎随时与班级老师联系。`,
    other: b => `各位家长：

${b}

感谢您的关注与配合！🌱`
  };
  const FEST = [["国庆","国庆节"],["中秋","中秋节"],["元旦","元旦"],["春节","春节"],["清明","清明节"],["端午","端午节"],["劳动","劳动节"],["六一","六一儿童节"],["新年","新年"],["妇女","妇女节"]];

  function generateContent(){
    const type = document.getElementById("f-type").value;
    const brief = document.getElementById("f-brief").value.trim();
    if(!brief){ alert("请先在下方填写简要说明，例如：国庆节10月1日到7日放假"); return; }
    const body = TYPE_BODY[type](brief);
    const date = document.getElementById("f-date").value || new Date().toISOString().slice(0,10);
    document.getElementById("f-content").value = body + "\n\n" + siteName + "\n" + fmtDate(date);

    const tEl = document.getElementById("f-title");
    if(!tEl.value.trim()){
      let title = TYPE_TITLE[type];
      for(const [k,v] of FEST){
        if(brief.includes(k)){
          title = (type === "holiday") ? v + "放假安排通知" : v + title;
          break;
        }
      }
      tEl.value = title;
    }
    document.getElementById("f-content").focus();
  }

  function delNotice(id){
    if(!confirm("确定删除这条通知吗？此操作不可撤销。")) return;
    notices = notices.filter(n => n.id !== id);
    save(notices);
    render();
  }

  function exportBackup(){
    const data = JSON.stringify(notices, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date().toISOString().slice(0,10).replace(/-/g,"");
    a.href = url;
    a.download = "渠头幼儿园通知公告备份_" + d + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const arr = JSON.parse(reader.result);
        if(!Array.isArray(arr)) throw new Error("格式不正确");
        notices = arr;
        save(notices);
        currentFilter = "all";
        buildFilters();
        render();
        alert("备份导入成功，共 " + arr.length + " 条通知！");
      }catch(err){
        alert("导入失败：文件格式不正确。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function resetSamples(){
    if(!confirm("确定恢复为示例通知吗？这将覆盖当前所有通知。")) return;
    notices = SAMPLES.slice();
    save(notices);
    currentFilter = "all";
    buildFilters();
    render();
  }

  let currentShare = null;

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        ()=>alert("已复制，可直接粘贴到微信 / 家长群转发～"),
        ()=>fallbackCopy(text)
      );
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text){
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; ta.style.top="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); alert("已复制，可直接粘贴转发～"); }
    catch(e){ alert("复制失败，请长按文字手动复制。"); }
    document.body.removeChild(ta);
  }
  function copyNotice(id){
    const n = notices.find(x=>x.id===id);
    if(!n) return;
    copyText(n.title + "\n发布日期：" + fmtDate(n.date) + "\n\n" + n.content + "\n\n—— " + siteName);
  }

  function openShare(id){
    const n = notices.find(x=>x.id===id);
    if(!n) return;
    currentShare = n;
    document.getElementById("shareCard").innerHTML =
      '<div class="sc-head">通知公告 · ' + escapeHtml(siteName) + '</div>' +
      (n.important ? '<div class="sc-imp">⚠ 重要通知</div>' : '') +
      '<div class="sc-title">' + escapeHtml(n.title) + '</div>' +
      '<div class="sc-date">📅 发布日期：' + escapeHtml(fmtDate(n.date)) + '</div>' +
      '<div class="sc-body">' + escapeHtml(n.content).replace(/\n/g,"<br>") + '</div>' +
      '<div class="sc-foot">—— ' + escapeHtml(siteName) + '</div>' +
      '<div class="sc-cta">📌 请家长及时查收 · 转达周知</div>';
    document.getElementById("shareImg").style.display = "none";
    document.getElementById("shareHint").style.display = "none";
    document.getElementById("shareMask").classList.add("show");
  }
  function closeShare(){ document.getElementById("shareMask").classList.remove("show"); }
  function copyShare(){
    if(!currentShare) return;
    copyText(currentShare.title + "\n发布日期：" + fmtDate(currentShare.date) + "\n\n" + currentShare.content + "\n\n—— " + siteName);
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function wrapText(ctx,text,maxW){
    const out=[];
    for(const para of text.split("\n")){
      if(para===""){ out.push(""); continue; }
      let line="";
      for(const ch of para){
        const test=line+ch;
        if(ctx.measureText(test).width>maxW && line){ out.push(line); line=ch; }
        else line=test;
      }
      out.push(line);
    }
    return out;
  }
  function saveCardImage(){
    const n = currentShare; if(!n) return;
    const FONT = "'PingFang SC','Microsoft YaHei',sans-serif";
    const W = 680, outer = 14, padX = 46, headH = 104;
    const contentW = W - 2*padX;
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");

    // 先测量文字行数（画布尺寸确定后再绘制）
    ctx.font = "bold 38px "+FONT;
    const titleLines = wrapText(ctx, n.title, contentW - 24);
    ctx.font = "22px "+FONT;
    const bodyLines = wrapText(ctx, stripEmoji(n.content), contentW);

    const titleLH = 50, bodyLH = 36, dateH = 46, footH = 30, ctaH = 46;
    const gapAfterHead = 30, gapTitleDiv = 18, gapDivDate = 22, gapDateBody = 24, gapBodyFoot = 22, gapFootCTA = 16, bottomPad = 28;
    const H = outer*2 + headH + gapAfterHead
            + titleLines.length*titleLH + gapTitleDiv + 10
            + gapDivDate + dateH + gapDateBody + bodyLines.length*bodyLH
            + gapBodyFoot + footH + gapFootCTA + ctaH + bottomPad;

    c.width = W; c.height = H;
    ctx.textBaseline = "top"; ctx.textAlign = "left";

    // 背景
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#FFF7E6"); g.addColorStop(1,"#FFF0F4");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // 白色卡片 + 粗橙边
    roundRect(ctx, outer, outer, W-2*outer, H-2*outer, 26);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = "#FF8A3D"; ctx.stroke();

    // 顶部醒目色带（橙→粉）
    ctx.save();
    roundRect(ctx, outer, outer, W-2*outer, headH, 26);
    ctx.clip();
    const hg = ctx.createLinearGradient(0,0,W,headH);
    hg.addColorStop(0,"#FF8A3D"); hg.addColorStop(1,"#FF6B9D");
    ctx.fillStyle = hg; ctx.fillRect(outer, outer, W-2*outer, headH);
    ctx.restore();

    // 色带文字（白、加粗）
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 30px "+FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(siteName + " · 通知公告", W/2, outer + headH/2);

    // 重要通知红色印章（贴在色带右侧）
    if(n.important){
      ctx.save();
      ctx.translate(W - outer - 80, outer + headH/2);
      ctx.rotate(-0.12);
      const bw=116, bh=46;
      roundRect(ctx, -bw/2, -bh/2, bw, bh, bh/2);
      ctx.fillStyle = "#FF3B3B"; ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px "+FONT;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("重要通知", 0, 0);
      ctx.restore();
    }

    let y = outer + headH + gapAfterHead;

    // 标题高亮底色（荧光黄，像记号笔）
    const hlX = 18, hlW = W-36, hlH = titleLines.length*titleLH;
    roundRect(ctx, hlX, y-8, hlW, hlH+16, 16);
    ctx.fillStyle = "rgba(255,206,92,0.55)";
    ctx.fill();

    // 标题
    ctx.font = "bold 38px "+FONT;
    ctx.fillStyle = "#3A2A22";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for(const t of titleLines){ ctx.fillText(t, W/2, y); y += titleLH; }
    y += gapTitleDiv;
    // 橙色分隔短线
    roundRect(ctx, W/2-42, y, 84, 7, 3);
    ctx.fillStyle = "#FF8A3D"; ctx.fill();
    y += 10 + gapDivDate;

    // 日期胶囊（亮橙底白字）
    const dt = "发布日期：" + fmtDate(n.date);
    ctx.font = "bold 21px "+FONT;
    const dtW = ctx.measureText(dt).width + 42;
    const dtX = (W - dtW)/2;
    roundRect(ctx, dtX, y, dtW, dateH, dateH/2);
    ctx.fillStyle = "#FF8A3D"; ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(dt, W/2, y + dateH/2);
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    y += dateH + gapDateBody;

    // 正文
    ctx.font = "22px "+FONT;
    ctx.fillStyle = "#4A3A32";
    for(const t of bodyLines){ ctx.fillText(t, padX, y); y += bodyLH; }

    // 落款
    y += gapBodyFoot;
    ctx.font = "bold 18px "+FONT;
    ctx.fillStyle = "#8A7A70";
    ctx.fillText("—— " + siteName, padX, y);
    y += footH + gapFootCTA;

    // 红色行动条：请家长及时查收
    const cta = "请家长及时查收 · 转达周知";
    ctx.font = "bold 21px "+FONT;
    const ctaW = ctx.measureText(cta).width + 46;
    const ctaX = (W - ctaW)/2;
    roundRect(ctx, ctaX, y, ctaW, ctaH, ctaH/2);
    ctx.fillStyle = "#FF3B3B"; ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(cta, W/2, y + ctaH/2);

    // 四角小圆点装饰（亮粉）
    const dots = [[outer+18,outer+18],[W-outer-18,outer+18],[outer+18,H-outer-18],[W-outer-18,H-outer-18]];
    ctx.fillStyle = "#FFB3C1";
    for(const [dx,dy] of dots){ ctx.beginPath(); ctx.arc(dx,dy,5,0,Math.PI*2); ctx.fill(); }

    const url = c.toDataURL("image/png");
    // 手机端：直接把图片显示在弹窗里，长按即可存到相册（iOS/安卓 Safari、微信内置浏览器通用）
    const img = document.getElementById("shareImg");
    img.src = url;
    img.style.display = "block";
    const hint = document.getElementById("shareHint");
    hint.style.display = "block";
    hint.innerHTML = "📱 手机端：长按上方图片，选择「存储到照片 / 保存到相册」即可保存转发<br>💻 电脑端：已自动下载图片，也可右键另存";
    // 电脑 / 安卓 Chrome 会直接触发下载；iOS 无反应但可用上方图片长按保存
    const a = document.createElement("a");
    a.href = url;
    a.download = (siteName+"_"+n.title+".png").replace(/[\\/:*?"<>|]/g,"");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  applySiteName();
  buildFilters();
  render();
</script>
</body>
</html>
